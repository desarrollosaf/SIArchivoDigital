services:
  frontend:
    image: node:24-alpine
    container_name: siarchivodigital-frontend
    working_dir: /app

    ports:
      - "4250:4200"

    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
      - /app/backend

    environment:
      CHOKIDAR_USEPOLLING: "true"
      BACKEND_HOST: backend
      BACKEND_PORT: "3060"

    command: >
      sh -c "npm install &&
      npm run start --
      --host 0.0.0.0
      --port 4200
      --poll=1000"

    depends_on:
      - backend

    restart: unless-stopped

  backend:
    image: node:24-alpine
    container_name: siarchivodigital-backend
    working_dir: /app

    ports:
      - "3095:3060"

    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - ./backend/uploads:/app/uploads

    env_file:
      - ./backend/.env

    environment:
      NODE_ENV: development
      PORT: 3060
      CHOKIDAR_USEPOLLING: "true"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    command: >
      sh -c "npm install &&
      npm run start:dev"

    restart: unless-stopped

volumes:
  frontend_node_modules:
  backend_node_modules:
